services:
  adt-portal-adminlte:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    expose:
      - "80"

    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      APP_ENV: ${APP_ENV:-qa}

    command: >
      /bin/sh -c "
      envsubst < /usr/share/nginx/html/assets/js/config.template.js > /usr/share/nginx/html/assets/js/config.js &&
      nginx -g 'daemon off;'
      "

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/login.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s